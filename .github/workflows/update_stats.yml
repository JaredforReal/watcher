name: Update Stats

on:
  schedule:
    # 每天 UTC 01:00 (北京时间 09:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python stats_watcher.py
        env:
          HF_ORG: ${{ secrets.HF_ORG }}
          MS_ORG: ${{ secrets.MS_ORG }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_DOWNLOADS_TABLE_ID: ${{ secrets.FEISHU_DOWNLOADS_TABLE_ID }}
          FEISHU_REPO_STARS_TABLE_ID: ${{ secrets.FEISHU_REPO_STARS_TABLE_ID }}